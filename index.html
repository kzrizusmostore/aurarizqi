<script>

{n:'GREEN VALLEY',sky:['#6ec6ff','#d8f3ff'],far:'#7aa7c7',mid:'#2f8f4e',near:'#1f6b3a',top:'#4cc24a',dirt:'#7a4a22',m:'t',len:900,d:.4,sp:1},
{n:'SUNSET BRIDGE',sky:['#ff7a45','#ffd08a'],far:'#a8505a',mid:'#6a2f55',near:'#3b1c3f',top:'#c98a3a',dirt:'#5c3a2a',m:'t',len:1000,d:.55,sp:1.04},
{n:'NEON CITY',sky:['#10062b','#3a0f66'],far:'#2b1457',mid:'#16123f',near:'#0c0a26',top:'#2a6aff',dirt:'#14143a',m:'b',len:1100,d:.7,sp:1.08,night:1},
{n:'CRYSTAL CAVE',sky:['#0b1b3a','#1f4a6e'],far:'#1d3d63',mid:'#2fb6c9',near:'#177a8f',top:'#5fd0e0',dirt:'#173a52',m:'t',len:1200,d:.8,sp:1.1,night:1},
{n:'SKY FORTRESS',sky:['#4aa3ff','#ffffff'],far:'#9ec8f0',mid:'#7f8fa8',near:'#53607a',top:'#d9e2ef',dirt:'#6b7790',m:'b',len:1400,d:.95,sp:1.14}];
// ===== UTIL =====

const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),pad=(n,l)=>String(Math.floor(n)).padStart(l,'0'),hs=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const rng=s=>()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
// ===== SAVE =====

try{Object.assign(SV,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
SV.un=cl(SV.un|0,0,4);SV.lv=cl(SV.lv|0,0,4);SV.q=cl(SV.q|0,0,2);if(!CH[SV.ch])SV.ch='aura';

// ===== AUDIO (Web Audio, semua suara dibuat prosedural) =====
const SC=[220,261.63,293.66,329.63,392,440,523.25];
const AU={c:null,on:false,nt:0,si:0,
init(){try{if(!this.c){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=this.c=new C();this.m=c.createGain();this.s=c.createGain();this.u=c.createGain();this.s.connect(this.m);this.u.connect(this.m);this.m.connect(c.destination);const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b}if(this.c.state==='suspended')this.c.resume();this.vol()}catch(e){this.c=null}},

o(f,g,d,ty,v,at,bus){const c=this.c;if(!c)return;const t=c.currentTime+(at||0),o=c.createOscillator(),a=c.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(g!==f)o.frequency.exponentialRampToValueAtTime(g,t+d);a.gain.setValueAtTime(v||.2,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(bus||this.s);o.start(t);o.stop(t+d+.02);o.onended=()=>{o.disconnect();a.disconnect()}},
n(d,v,at){const c=this.c;if(!c)return;const t=c.currentTime+(at||0),s=c.createBufferSource(),a=c.createGain();s.buffer=this.nb;a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(a);a.connect(this.s);s.start(t,Math.random()*.5);s.stop(t+d+.02);s.onended=()=>{s.disconnect();a.disconnect()}},

const tn=(...a)=>AU.o(...a),nz=(...a)=>AU.n(...a);
const SFX={click:()=>tn(900,1300,.06,'square',.12),jump:()=>tn(260,640,.18,'square',.14),land:()=>tn(150,60,.1,'triangle',.3),step:()=>nz(.03,.05),
coin:()=>{tn(988,988,.07,'square',.1);tn(1319,1319,.12,'square',.1,.07)},rare:()=>{tn(988,988,.06,'square',.1);tn(1319,1319,.06,'square',.1,.06);tn(1760,1760,.16,'square',.1,.12)},
hit:()=>{nz(.25,.35);tn(220,50,.25,'sawtooth',.2)},boost:()=>tn(200,900,.35,'sawtooth',.14),shield:()=>{tn(500,1000,.15,'sine',.25);tn(1000,1500,.2,'sine',.2,.12)},
repair:()=>[523,659,784].forEach((f,i)=>tn(f,f,.12,'triangle',.25,i*.09)),warn:()=>{tn(880,880,.1,'square',.09);tn(660,660,.1,'square',.09,.14)},
go:()=>[392,523,659,784].forEach((f,i)=>tn(f,f,.12,'square',.12,i*.08)),win:()=>[523,659,784,1047,1319].forEach((f,i)=>tn(f,f,.2,'square',.14,i*.13)),
lose:()=>[440,370,311,220].forEach((f,i)=>tn(f,f*.9,.28,'sawtooth',.14,i*.2)),pause:()=>tn(600,300,.1,'square',.12),resume:()=>tn(300,700,.1,'square',.12),
unlock:()=>[660,880,1320].forEach((f,i)=>tn(f,f,.15,'triangle',.25,i*.1))};
// ===== ASET =====
function loadOne(c,k){return new Promise(res=>{const q=FILES[k].slice(),nx=()=>{if(!q.length){FAIL.push(c+'/'+FILES[k][0]);return res()}const f=q.shift(),im=new Image();im.onload=()=>{IMG[c][k]=im;res()};im.onerror=()=>{console.warn('Gagal memuat: '+c+'/'+f);nx()};im.src=c+'/'+f};nx()})}
function prog(f){const b=$('lb'),t=$('lt');if(b)b.style.width=Math.round(f*100)+'%';if(t)t.textContent=Math.round(f*100)+'%'}
async function boot(){S='LOADING';FAIL.length=0;show('load');let d=0;const n=14,jobs=[];for(const c in CH)for(const k in FILES){if(IMG[c][k]){d++;continue}jobs.push(loadOne(c,k).then(()=>{d++;prog(d/n)}))}prog(d/n);await Promise.all(jobs);if(FAIL.length)show('diag');else toMenu()}
// ===== UI =====
const stats=()=>{const g=G,d=Math.max(0,Math.min(g.p.x,g.fin)-300)/PM;return`<p>SKOR ${pad(g.score,6)} | REKOR ${pad(SV.hi,6)}</p><p>JARAK ${d|0} m | KOIN ${g.coins}</p><p>WAKTU ${g.t.toFixed(1)} dtk${g.bonus?' | BONUS '+g.bonus:''}</p>`};
const rg=(k,l)=>`<label>${l}<input type=range data-k=${k} min=0 max=100 value=${Math.round(SV[k]*100)}></label>`;
const P={
load:()=>`<div class=p><h2>MEMUAT ASET...</h2><div class=bar><i id=lb></i></div><small id=lt>0%</small></div>`,
diag:()=>`<div class=p><h2>ASET GAGAL DIMUAT</h2><small>${FAIL.join('<br>')}</small><small>Letakkan folder aura/ dan rizqi/ di samping index.html (lebih aman lewat server lokal). Placeholder dipakai bila lanjut.</small><button data-a=retryload>COBA LAGI</button><button data-a=cont>LANJUT</button></div>`,
menu:()=>`<div class=p><h1>AURA &amp; RIZQI</h1><h2>ESCAPE RUN</h2><small>RUN FAST. JUMP SMART. NEVER GET CAUGHT.</small><button data-a=play>PLAY</button><button data-a=sel>PILIH KARAKTER</button><br><button data-a=lvl>LEVEL</button><button data-a=set>PENGATURAN</button><br><button data-a=how>CARA BERMAIN</button><button data-a=cred>KREDIT</button><button data-a=fs>LAYAR PENUH</button><small>REKOR ${pad(SV.hi,6)}</small></div>`,
sel:()=>`<div class=p><h2>PILIH KARAKTER</h2><div class=cards>${['aura','rizqi'].map(c=>`<div class="card${SV.ch==c?' s':''}" data-a=pick data-c=${c}><canvas class=pv data-c=${c} width=200 height=260></canvas><b>${CH[c].n}</b><small>${CH[c].full}<br>Role: RUNNER | Kecepatan: Tinggi<br>Pengejar: ${CH[CH[c].other].n}</small></div>`).join('')}</div><button data-a=go>MULAI LARI</button><button data-a=menu>KEMBALI</button></div>`,
lvl:()=>`<div class=p><h2>LEVEL</h2>${LV.map((l,i)=>`<button data-a=lv data-i=${i} ${i<=SV.un?'':'disabled'}>${i+1}. ${l.n}${i<=SV.un?'':' [TERKUNCI]'}</button>`).join('<br>')}<br><button data-a=menu>KEMBALI</button></div>`,
set:()=>`<div class=p><h2>PENGATURAN</h2>${rg('vm','MASTER')}${rg('vu','MUSIK')}${rg('vs','EFEK SUARA')}<button data-a=mute>SUARA: ${SV.mute?'MATI':'HIDUP'}</button><button data-a=q>GRAFIS: ${['LOW','MEDIUM','HIGH'][SV.q]}</button><br><button data-a=vib>GETAR: ${SV.vib?'ON':'OFF'}</button><button data-a=fs>LAYAR PENUH</button><button data-a=back>KEMBALI</button></div>`,
how:()=>`<div class=p><h2>CARA BERMAIN</h2><small>Lari otomatis ke kanan. LOMPAT: tombol besar / Spasi / Panah Atas / W (tahan = lebih tinggi). BOOST: Shift / tombol biru. PAUSE: Esc / P.<br>Hindari rintangan dan jurang, kumpulkan koin. Item: S = perisai, + = HP, B = boost.<br>Kamu lebih cepat dari pengejar, tapi tabrakan membuatmu melambat. HP 200 habis = kalah. Tertangkap = kalah. Capai garis finis untuk menang!</small><button data-a=menu>KEMBALI</button></div>`,
cred:()=>`<div class=p><h2>KREDIT</h2><small>AURA &amp; RIZQI: ESCAPE RUN<br>HTML5 Canvas + Web Audio.<br>Musik, efek suara, dan dunia game dibuat prosedural (orisinal).<br>Karakter: aset PNG milik pengguna.</small><button data-a=menu>KEMBALI</button></div>`,
pause:()=>`<div class=p><h2>JEDA</h2><button data-a=resume>LANJUTKAN</button><br><button data-a=retry>ULANGI LEVEL</button><br><button data-a=set>PENGATURAN SUARA</button><br><button data-a=menu>KEMBALI KE MENU</button></div>`,
over:()=>`<div class=p><h2>${G.end.k==='hp'?'HP KAMU HABIS!':'KAMU BERHASIL DITANGKAP!'}</h2>${stats()}<button data-a=retry>COBA LAGI</button><button data-a=menu>KEMBALI KE MENU</button></div>`,
win:()=>`<div class=p><h1>LEVEL COMPLETED!</h1>${stats()}<button data-a=next ${lv<LV.length-1?'':'disabled'}>LEVEL BERIKUTNYA</button><button data-a=retry>MAIN LAGI</button><button data-a=menu>MENU UTAMA</button></div>`};
function pv(k){const c=k.dataset.c,im=IMG[c].diam,x=k.getContext('2d');x.clearRect(0,0,k.width,k.height);if(im){const s=Math.min(k.width/im.naturalWidth,k.height/im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;x.drawImage(im,(k.width-w)/2,k.height-h,w,h)}else{x.fillStyle=CH[c].col;x.fillRect(40,30,k.width-80,k.height-30);x.fillStyle='#fff';x.font='bold 48px "Courier New",monospace';x.textAlign='center';x.fillText(CH[c].n[0],k.width/2,k.height/2+16)}}
function show(n){ui.innerHTML=P[n]();ui.classList.add('on');if(n==='sel')ui.querySelectorAll('.pv').forEach(k=>pv(k))}

function toMenu(){S='MENU';G=null;AU.on=false;ctl.classList.remove('on');show('menu')}
function fs(){try{const e=document.documentElement,go=e.requestFullscreen||e.webkitRequestFullscreen;if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}if(!go)return;Promise.resolve(go.call(e)).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(_){}}).catch(()=>{})}catch(_){}}
function act(a,d){switch(a){
case'menu':toMenu();break;case'play':case'go':start(SV.lv);break;case'sel':S='SELECT';show('sel');break;
case'pick':SV.ch=d.c;save();show('sel');break;case'lvl':S='LEVEL';show('lvl');break;case'lv':start(+d.i);break;
case'set':prev=S==='PAUSE'?'pause':'menu';show('set');break;case'back':show(prev);break;case'how':show('how');break;case'cred':show('cred');break;
case'fs':fs();break;case'mute':SV.mute=+!SV.mute;AU.vol();save();show('set');break;case'q':SV.q=(SV.q+1)%3;save();show('set');break;case'vib':SV.vib=+!SV.vib;save();show('set');break;
case'resume':resume();break;case'retry':start(lv);break;case'next':start(Math.min(lv+1,LV.length-1));break;

ui.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;AU.init();AU.sfx('click');act(b.dataset.a,b.dataset)});
ui.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;SV[k]=+e.target.value/100;AU.init();AU.vol();save()});
// ===== INPUT =====
function bind(el,dn,up){const d=e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}el.classList.add('d');dn()},u=()=>{el.classList.remove('d');up()};el.addEventListener('pointerdown',d);['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(t=>el.addEventListener(t,u))}
bind($('bj'),()=>{IN.j=1;IN.jp=1},()=>{IN.j=0});bind(bb,()=>{IN.bp=1},()=>{});bind($('bp'),()=>togglePause(),()=>{});
addEventListener('keydown',e=>{const k=e.code;if(k==='Space'||k==='ArrowUp'||k==='KeyW'){e.preventDefault();if(!KD[k]){KD[k]=1;IN.j=1;IN.jp=1}}else if(k==='ShiftLeft'||k==='ShiftRight'){if(!KD[k]){KD[k]=1;IN.bp=1}}else if((k==='Escape'||k==='KeyP')&&!e.repeat)togglePause()});
addEventListener('keyup',e=>{KD[e.code]=0;if(!KD.Space&&!KD.ArrowUp&&!KD.KeyW)IN.j=0;});
addEventListener('blur',()=>{IN.j=0;for(const k in KD)KD[k]=0;pause()});

function togglePause(){if(S==='PLAY'||S==='COUNT')pause();else if(S==='PAUSE')resume()}

// ===== LEVEL =====
function mk(i){const L=LV[i],r=rng(i*131+7),len=L.len*PM,O=[],C=[],P2=[],W=[],pits=[],R=[['rock',44,40],['crate',56,56],['log',120,36],['wall',40,92],['spike',100,28]];let x=900,nx=1500;
